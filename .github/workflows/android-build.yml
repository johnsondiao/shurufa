name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Android 工程位于仓库二级子目录
        working-directory: PersonalIME/PersonalIME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 仓库未包含 gradle-wrapper.jar，直接安装 Gradle 8.5 使用
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-release
          path: PersonalIME/PersonalIME/app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-debug
          path: PersonalIME/PersonalIME/app/build/outputs/apk/debug/*.apk

      # 发布到 GitHub Releases：附件公开可下载，手机浏览器直接安装，无需登录 Actions
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PersonalIME v1.0.${{ github.run_number }}
          body: |
            自动构建（提交 ${{ github.sha }}）

            下载 PersonalIME-release.apk 安装。
            首次启动会把内置词库（约 25 MB、38.7 万条）解压到应用私有目录，属一次性动作；
            在此之前候选栏会显示“词库加载中…”，完成后即可正常输入。
          files: |
            PersonalIME/PersonalIME/app/build/outputs/apk/release/*.apk
            PersonalIME/PersonalIME/app/build/outputs/apk/debug/*.apk
